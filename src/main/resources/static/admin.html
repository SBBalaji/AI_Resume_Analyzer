<!doctype html>
<html>
  <head>
    <title>Admin Dashboard</title>

    <style>
      body {
        font-family: Arial;
        background: #eef2f7;
        margin: 0;
      }

      .navbar {
        background: #2c3e50;
        color: white;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .nav-links {
        display: flex;
        align-items: center;
      }

      .nav-links a {
        color: white;
        margin-left: 20px;
        text-decoration: none;
        font-weight: bold;
      }

      .settings {
        position: relative;
        display: inline-block;
        margin-left: 20px;
      }

      .dropdown {
        display: none;
        position: absolute;
        background: white;
        right: 0;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        border-radius: 5px;
      }

      .dropdown a {
        display: block;
        padding: 10px;
        color: black;
        text-decoration: none;
      }

      .settings:hover .dropdown {
        display: block;
      }

      .table-container {
        width: 95%;
        margin: auto;
        margin-top: 30px;
        overflow-x: auto;
      }

      table {
        width: 100%;
        min-width: 1600px;
        border-collapse: collapse;
        background: white;
      }

      th {
        background: #667eea;
        color: white;
        padding: 10px;
      }

      td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
      }

      button {
        padding: 6px 10px;
        background: red;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="navbar">
      <div><b>AI Resume Analyzer</b></div>

      <div class="nav-links">
        <a href="index.html">Dashboard</a>

        <div class="settings">
          <span id="userInfo"></span>

          <div class="dropdown">
            <a href="logout.html">Logout</a>
          </div>
        </div>
      </div>
    </div>

    <h2 style="text-align: center; margin-top: 30px">Admin Dashboard</h2>

    <div style="width: 95%; margin: auto; margin-top: 20px">
      <input
        type="text"
        id="searchInput"
        placeholder="Search Candidate..."
        onkeyup="searchCandidate()"
        style="padding: 8px; width: 250px"
      />

      <select id="scoreFilter" onchange="filterScore()" style="padding: 8px">
        <option value="">All Scores</option>
        <option value="90">Above 90%</option>
        <option value="80">Above 80%</option>
        <option value="70">Above 70%</option>
        <option value="50">Above 50%</option>
      </select>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Candidate Email</th>
            <th>Candidate Name</th>
            <th>Phone</th>
            <th>Location</th>
            <th>Degree</th>
            <th>Stream</th>
            <th>University</th>
            <th>CGPA</th>
            <th>Passout Year</th>
            <th>Status</th>
            <th>Score</th>
            <th>Matched Skills</th>
            <th>Missing Skills</th>
            <th>Analyzed Date</th>
            <th>Delete</th>
          </tr>
        </thead>

        <tbody id="analysisTable"></tbody>
      </table>
    </div>

    <script>
      if (!localStorage.getItem("userEmail")) {
        window.location = "login.html";
      }

      const name = localStorage.getItem("userName");
      const email = localStorage.getItem("userEmail");

      document.getElementById("userInfo").innerText = name + " (" + email + ")";

      async function loadAnalysis() {
        const adminEmail = localStorage.getItem("userEmail");

        const response = await fetch(
          "http://localhost:8080/api/admin/analysis?adminEmail=" + adminEmail,
        );

        const data = await response.json();

        const table = document.getElementById("analysisTable");

        let html = "";

        data.forEach((a) => {
          html += `

<tr class="analysisRow">

<td>${a.id}</td>
<td class="email">${a.candidateEmail}</td>
<td class="name">${a.candidateName}</td>
<td>${a.phone}</td>
<td>${a.location}</td>
<td>${a.degree}</td>
<td>${a.stream}</td>
<td>${a.university}</td>
<td>${a.cgpa}</td>
<td>${a.passoutYear}</td>
<td>${a.currentStatus}</td>
<td class="score">${a.matchScore}</td>
<td>${a.matchedSkills}</td>
<td>${a.missingSkills}</td>
<td>${a.analysisDate}</td>

<td>
<button onclick="deleteAnalysis('${a.id}',this)">
Delete
</button>
</td>

</tr>

`;
        });

        table.innerHTML = html;
      }

      loadAnalysis();

      async function deleteAnalysis(id, btn) {
        if (!confirm("Delete record?")) return;

        await fetch("http://localhost:8080/api/admin/delete/" + id, {
          method: "DELETE",
        });

        btn.closest("tr").remove();
      }

      function searchCandidate() {
        const input = document
          .getElementById("searchInput")
          .value.toLowerCase();

        const rows = document.querySelectorAll(".analysisRow");

        rows.forEach((row) => {
          const email = row.querySelector(".email").innerText.toLowerCase();
          const name = row.querySelector(".name").innerText.toLowerCase();

          if (email.includes(input) || name.includes(input)) {
            row.style.display = "";
          } else {
            row.style.display = "none";
          }
        });
      }

      function filterScore() {
        const filter = document.getElementById("scoreFilter").value;

        const rows = document.querySelectorAll(".analysisRow");

        rows.forEach((row) => {
          const score = parseInt(row.querySelector(".score").innerText);

          if (filter == "" || score >= filter) {
            row.style.display = "";
          } else {
            row.style.display = "none";
          }
        });
      }
    </script>
  </body>
</html>
