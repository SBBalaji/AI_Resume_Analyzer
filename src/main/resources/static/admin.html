<!doctype html>
<html>
  <head>
    <title>Admin Dashboard</title>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
      }

      /* NAVBAR */
      .navbar {
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .nav-links {
        display: flex;
        align-items: center;
      }

      .nav-links a {
        color: white;
        margin-left: 20px;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
      }

      .nav-links a:hover {
        color: #ffd369;
      }

      .settings {
        position: relative;
        margin-left: 20px;
      }

      .dropdown {
        display: none;
        position: absolute;
        right: 0;
        background: white;
        color: black;
        border-radius: 6px;
        overflow: hidden;
      }

      .dropdown a {
        display: block;
        padding: 10px;
        text-decoration: none;
        color: black;
      }

      .settings:hover .dropdown {
        display: block;
      }

      /* FILTER */
      .filters {
        width: 95%;
        margin: 20px auto;
        display: flex;
        gap: 10px;
      }

      input,
      select {
        padding: 10px;
        border-radius: 6px;
        border: none;
      }

      /* TABLE */
      .table-container {
        width: 95%;
        margin: auto;
        background: white;
        border-radius: 12px;
        padding: 20px;
        color: black;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        animation: fadeIn 0.8s ease;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: #667eea;
        color: white;
        padding: 12px;
      }

      td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
      }

      tr {
        transition: 0.3s;
      }

      tr:hover {
        background: #f5f7ff;
        transform: scale(1.01);
      }

      /* BUTTON */
      button {
        background: red;
        color: white;
        border: none;
        padding: 6px 10px;
        border-radius: 5px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #c0392b;
      }

      /* ANIMATION */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div class="navbar">
      <b>🚀 AI Resume Analyzer</b>

      <div class="nav-links">
        <a href="index.html">Dashboard</a>

        <div class="settings">
          <span id="userInfo"></span>

          <div class="dropdown">
            <a href="logout.html">Logout</a>
          </div>
        </div>
      </div>
    </div>

    <h2 style="text-align: center">Admin Dashboard</h2>

    <div class="filters">
      <input
        id="searchInput"
        placeholder="Search Email..."
        onkeyup="searchCandidate()"
      />

      <select id="scoreFilter" onchange="filterScore()">
        <option value="">All</option>
        <option value="90">Above 90%</option>
        <option value="80">Above 80%</option>
        <option value="50">Above 50%</option>
      </select>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Score</th>
            <th>Matched</th>
            <th>Missing</th>
            <th>Date</th>
            <th>Delete</th>
          </tr>
        </thead>

        <tbody id="analysisTable"></tbody>
      </table>
    </div>

    <script>
      const name = localStorage.getItem("userName");
      const email = localStorage.getItem("userEmail");

      document.getElementById("userInfo").innerText = name + " (" + email + ")";

      async function loadAnalysis() {
        const res = await fetch("http://localhost:8080/api/admin/all");
        const data = await res.json();

        let html = "";
        data.forEach((a) => {
          html += `
    <tr>
      <td>${a.id}</td>
      <td class="email">${a.email}</td>
      <td class="score">${a.matchScore}%</td>
      <td>${a.matchedSkills}</td>
      <td>${a.missingSkills}</td>
      <td>${a.analysisDate}</td>
      <td><button onclick="deleteRow(${a.id},this)">Delete</button></td>
    </tr>`;
        });

        document.getElementById("analysisTable").innerHTML = html;
      }

      function deleteRow(id, btn) {
        fetch("http://localhost:8080/api/admin/delete/" + id, {
          method: "DELETE",
        });
        btn.closest("tr").remove();
      }

      function searchCandidate() {
        let val = document.getElementById("searchInput").value.toLowerCase();
        document.querySelectorAll("tr").forEach((r) => {
          if (r.innerText.toLowerCase().includes(val)) r.style.display = "";
          else r.style.display = "none";
        });
      }

      function filterScore() {
        let val = document.getElementById("scoreFilter").value;
        document.querySelectorAll(".score").forEach((td) => {
          let score = parseInt(td.innerText);
          td.parentElement.style.display =
            val == "" || score >= val ? "" : "none";
        });
      }

      loadAnalysis();
    </script>
  </body>
</html>
