<!doctype html>
<html>
  <head>
    <title>Logout</title>

    <style>
      body {
        font-family: Arial;
        background: #f4f4f4;
        text-align: center;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        background: white;
        padding: 40px;
        width: 400px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px gray;
      }

      button {
        padding: 10px 20px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 15px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>You have been logged out</h2>

      <p>Thank you for using Resume Analyzer</p>

      <button onclick="login()">Login Again</button>
    </div>

    <script>
      localStorage.clear();

      alert("Logged out successfully");

      function login() {
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
