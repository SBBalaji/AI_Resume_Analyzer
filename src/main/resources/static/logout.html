<!doctype html>
<html>
  <head>
    <title>Logout</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: Arial;
      }

      /* ✅ UPDATED BODY */
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        text-align: center;
      }

      /* ✅ CONTAINER WITH ANIMATION */
      .container {
        background: white;
        padding: 40px;
        width: 400px;
        border-radius: 12px;
        box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.2);
        animation: fadeIn 0.8s ease;
        color: black; /* keep text visible inside white box */
      }

      /* ✅ FADE-IN ANIMATION */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
        }
      }

      h2 {
        margin-bottom: 10px;
      }

      p {
        color: #555;
      }

      button {
        padding: 12px 20px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 20px;
        transition: 0.3s;
      }

      button:hover {
        background: #5a67d8;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>You have been logged out</h2>

      <p>Thank you for using Resume Analyzer</p>

      <button onclick="login()">Login Again</button>
    </div>

    <script>
      localStorage.clear();

      alert("Logged out successfully");

      function login() {
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
