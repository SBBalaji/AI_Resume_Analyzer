<!doctype html>
<html>
  <head>
    <title>Signup | AI Resume Analyzer</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: Arial;
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(-45deg, #667eea, #764ba2, #6a11cb, #2575fc);
        background-size: 400% 400%;
        animation: gradientMove 8s ease infinite;
      }

      @keyframes gradientMove {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .container {
        background: white;
        padding: 40px;
        width: 360px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      h2 {
        text-align: center;
        margin-bottom: 25px;
      }

      input {
        width: 100%;
        padding: 10px;
        margin: 5px 0 15px;
        border-radius: 5px;
        border: 1px solid #ccc;
      }

      .password-box {
        position: relative;
      }

      .toggle {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 12px;
        color: #667eea;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #667eea;
        border: none;
        color: white;
        border-radius: 6px;
        cursor: pointer;
      }

      #loadingText {
        display: none;
        text-align: center;
        color: #667eea;
      }

      .link {
        text-align: center;
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Create Account</h2>

      <form id="signupForm">
        <input id="name" placeholder="Full Name" required />
        <input id="email" type="email" placeholder="Email" required />

        <div class="password-box">
          <input
            id="password"
            type="password"
            placeholder="Password"
            required
          />
          <span
            class="toggle"
            onclick="togglePassword('password', 't1')"
            id="t1"
            >Show</span
          >
        </div>

        <div class="password-box">
          <input
            id="confirmPassword"
            type="password"
            placeholder="Confirm Password"
            required
          />
          <span
            class="toggle"
            onclick="togglePassword('confirmPassword', 't2')"
            id="t2"
            >Show</span
          >
        </div>

        <button id="signupBtn" type="submit">Signup</button>
      </form>

      <p id="loadingText">Signing up...</p>

      <p class="link">Already have account? <a href="login.html">Login</a></p>

      <!-- ✅ ADDED FORGOT PASSWORD LINK -->
      <p class="link">
        <a href="forgot.html" style="color: red">Forgot Password?</a>
      </p>
    </div>

    <script>
      function togglePassword(id, toggle) {
        const field = document.getElementById(id);
        const btn = document.getElementById(toggle);

        if (field.type === "password") {
          field.type = "text";
          btn.innerText = "Hide";
        } else {
          field.type = "password";
          btn.innerText = "Show";
        }
      }

      document.getElementById("signupForm").addEventListener("submit", signup);

      async function signup(e) {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirmPassword").value;

        if (!name || !email || !password || !confirm) {
          alert("All fields required");
          return;
        }

        if (password !== confirm) {
          alert("Passwords do not match");
          return;
        }

        const BASE_URL = window.location.origin.includes("127.0.0.1")
          ? "http://localhost:8080"
          : window.location.origin;

        const btn = document.getElementById("signupBtn");
        const loading = document.getElementById("loadingText");

        btn.disabled = true;
        loading.style.display = "block";

        try {
          const res = await fetch(`${BASE_URL}/api/auth/signup`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ name, email, password }),
          });

          const data = await res.json();

          if (data.success) {
            localStorage.setItem("userName", data.name);
            localStorage.setItem("userEmail", data.email);

            window.location.href = "login.html";
          } else {
            alert(data.message);
          }
        } catch (err) {
          console.log("Offline mode activated");

          localStorage.setItem("userName", name);
          localStorage.setItem("userEmail", email);

          alert("Offline Mode: Signup simulated");

          window.location.href = "login.html";
        }

        btn.disabled = false;
        loading.style.display = "none";
      }
    </script>
  </body>
</html>
