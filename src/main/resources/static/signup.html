<!doctype html>
<html>
  <head>
    <title>Signup | AI Resume Analyzer</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: Arial;
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(-45deg, #667eea, #764ba2, #6a11cb, #2575fc);
        background-size: 400% 400%;
        animation: gradientMove 8s ease infinite;
      }

      @keyframes gradientMove {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .container {
        background: white;
        padding: 40px;
        width: 360px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      h2 {
        text-align: center;
        margin-bottom: 25px;
      }

      label {
        font-size: 14px;
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-bottom: 15px;
        border-radius: 5px;
        border: 1px solid #ccc;
      }

      .password-box {
        position: relative;
      }

      .toggle {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 12px;
        color: #667eea;
        font-weight: bold;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #667eea;
        border: none;
        color: white;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
      }

      button:hover {
        background: #5a67d8;
      }

      .link {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
      }

      .link a {
        color: #667eea;
        text-decoration: none;
        font-weight: bold;
      }

      #loadingText {
        display: none;
        text-align: center;
        color: #667eea;
        font-weight: bold;
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Create Account</h2>

      <form id="signupForm">
        <label>Full Name</label>
        <input id="name" required />

        <label>Email</label>
        <input id="email" required />

        <label>Password</label>

        <div class="password-box">
          <input id="password" type="password" required />
          <span
            class="toggle"
            onclick="togglePassword('password', 't1')"
            id="t1"
            >Show</span
          >
        </div>

        <label>Confirm Password</label>

        <div class="password-box">
          <input id="confirmPassword" type="password" required />
          <span
            class="toggle"
            onclick="togglePassword('confirmPassword', 't2')"
            id="t2"
            >Show</span
          >
        </div>

        <button type="submit">Signup</button>
      </form>

      <p id="loadingText">Signing in...</p>

      <p class="link">Already have account? <a href="login.html">Login</a></p>
    </div>
    <script>
      function togglePassword(id, toggle) {
        const field = document.getElementById(id);
        const btn = document.getElementById(toggle);

        if (field.type === "password") {
          field.type = "text";
          btn.innerText = "Hide";
        } else {
          field.type = "password";
          btn.innerText = "Show";
        }
      }

      document.getElementById("signupForm").addEventListener("submit", signup);

      async function signup(e) {
        e.preventDefault();

        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirmPassword").value;

        if (password !== confirm) {
          alert("Passwords do not match");
          return;
        }

        const data = {
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          password: password,
        };

        const res = await fetch("http://localhost:8080/api/auth/signup", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        });

        const text = await res.text();

        /* FIX ADDED HERE */
        if (text === "Signup Successful") {
          document.getElementById("loadingText").style.display = "block";

          setTimeout(() => {
            window.location = "login.html";
          }, 1500);
        } else {
          alert(text);
        }
      }
    </script>
  </body>
</html>
