<!doctype html>
<html>
  <head>
    <title>Resume Analyzer Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <h2>Resume Skill Dashboard</h2>

    <!-- ✅ USERNAME DISPLAY -->
    <h3>Welcome: <span id="username"></span></h3>

    <form id="resumeForm">
      Resume PDF:
      <input type="file" id="file" required /><br /><br />

      Job Skills (comma separated):
      <input
        type="text"
        id="jobDesc"
        placeholder="java,spring boot,mysql"
      /><br /><br />

      Email:
      <input type="text" id="email" /><br /><br />

      <!-- ✅ BUTTON (FORM SUBMIT WILL HANDLE) -->
      <button type="submit">Analyze</button>
    </form>

    <br /><br />

    <canvas id="skillChart"></canvas>

    <!-- ✅ NEW SCRIPT (REPLACED FULLY) -->
    <script>
      // ✅ USERNAME FIX (based on login storage)
      document.getElementById("username").innerText =
        localStorage.getItem("name") || "Guest";

      document
        .getElementById("resumeForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          try {
            const fileInput = document.getElementById("file");

            if (!fileInput.files[0]) {
              alert("Please upload resume");
              return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            formData.append(
              "jobDesc",
              document.getElementById("jobDesc").value,
            );
            formData.append("email", document.getElementById("email").value);

            const response = await fetch(
              "https://ai-resume-analyzer-u8mq.onrender.com/api/resume/upload",
              {
                method: "POST",
                body: formData,
              },
            );

            if (!response.ok) {
              throw new Error("Server error");
            }

            const result = await response.json();

            console.log(result);

            const matched = result.matchedSkills || [];
            const missing = result.missingSkills || [];

            const labels = [...matched, ...missing];

            const dataValues = [];
            matched.forEach(() => dataValues.push(100));
            missing.forEach(() => dataValues.push(0));

            const colors = [];
            matched.forEach(() => colors.push("green"));
            missing.forEach(() => colors.push("red"));

            // ✅ DESTROY OLD CHART (important fix)
            if (window.myChart) {
              window.myChart.destroy();
            }

            window.myChart = new Chart(document.getElementById("skillChart"), {
              type: "bar",
              data: {
                labels: labels,
                datasets: [
                  {
                    label: "Skill Match",
                    data: dataValues,
                    backgroundColor: colors,
                  },
                ],
              },
            });
          } catch (err) {
            alert("Error: " + err.message);
            console.error(err);
          }
        });
    </script>
  </body>
</html>
