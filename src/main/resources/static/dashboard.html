<!doctype html>
<html>
  <head>
    <title>AI Resume Analyzer</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI";
      }

      body {
        margin: 0;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
      }

      /* NAVBAR */
      .navbar {
        display: flex;
        justify-content: space-between;
        padding: 15px 30px;
        background: rgba(0, 0, 0, 0.3);
      }

      .nav-right a {
        margin-left: 20px;
        cursor: pointer;
        font-weight: bold;
      }

      .nav-right a:hover {
        color: yellow;
      }

      /* LAYOUT */
      .container {
        display: flex;
        height: calc(100vh - 60px);
        padding: 30px;
        gap: 20px;
      }

      .left,
      .right {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .box {
        width: 90%;
        padding: 25px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.15);
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 8px;
        border: none;
      }

      button {
        margin-top: 10px;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: #00c6ff;
        color: white;
        cursor: pointer;
      }

      button:hover {
        transform: scale(1.05);
      }

      /* CIRCLE */
      .circle {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: auto;
        font-size: 28px;
        background: conic-gradient(#ddd 0deg, #ddd 360deg);
      }

      .matched {
        color: lightgreen;
      }
      .missing {
        color: #ff8080;
      }

      table {
        width: 100%;
        background: white;
        color: black;
        border-radius: 10px;
      }

      th,
      td {
        padding: 10px;
        text-align: center;
      }

      th {
        background: #667eea;
        color: white;
      }

      .delete {
        color: red;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="navbar">
      <b>🚀 AI Resume Analyzer</b>

      <div class="nav-right">
        <a onclick="showDashboard()">Dashboard</a>
        <a onclick="showAnalysis()">Analysis</a>
        <a onclick="logout()">Logout</a>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="container">
      <div class="left">
        <div class="box">
          <h3>Upload Resume</h3>

          <input type="file" id="file" />
          <input id="skills" placeholder="java,python,react" />

          <button onclick="analyze()">Analyze</button>

          <p id="loading" style="display: none">⏳ Analyzing...</p>
        </div>
      </div>

      <div class="right">
        <div class="box">
          <div class="circle" id="circle">0%</div>

          <h3>Email: <span id="email"></span></h3>

          <a id="downloadBtn" style="color: yellow">Download Resume</a>

          <h4>Matched Skills</h4>
          <div id="matched"></div>

          <h4>Missing Skills</h4>
          <div id="missing"></div>
        </div>
      </div>
    </div>

    <!-- ANALYSIS -->
    <div id="analysis" style="display: none; padding: 20px">
      <input
        id="search"
        placeholder="Search email..."
        onkeyup="filterTable()"
      />

      <select id="filter" onchange="applyFilter()">
        <option value="">Sort By</option>
        <option value="scoreAsc">Score Asc</option>
        <option value="scoreDesc">Score Desc</option>
        <option value="new">Newest First</option>
        <option value="old">Oldest First</option>
      </select>

      <table id="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Score</th>
            <th>Matched Skills</th>
            <th>Missing Skills</th>
            <th>Date</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script>
      const BASE_URL = "http://localhost:8080";

      const dashboard = document.getElementById("dashboard");
      const analysis = document.getElementById("analysis");
      const loading = document.getElementById("loading");
      const email = document.getElementById("email");
      const matched = document.getElementById("matched");
      const missing = document.getElementById("missing");
      const downloadBtn = document.getElementById("downloadBtn");

      function logout() {
        localStorage.clear();
        location.href = "login.html";
      }

      function showDashboard() {
        dashboard.style.display = "flex";
        analysis.style.display = "none";
      }

      function showAnalysis() {
        dashboard.style.display = "none";
        analysis.style.display = "block";
        loadTable();
      }

      function animateCircle(score) {
        let circle = document.getElementById("circle");
        let current = 0;

        let colors = [
          "#ff4d4d",
          "#ff7043",
          "#ff9800",
          "#ffc107",
          "#cddc39",
          "#8bc34a",
          "#4caf50",
          "#2ecc71",
          "#00c853",
          "#00e676",
        ];

        let interval = setInterval(() => {
          if (current >= score) {
            clearInterval(interval);
          } else {
            current++;
            let color = colors[Math.floor(current / 10)] || "#00e676";
            circle.innerText = current + "%";
            circle.style.background = `conic-gradient(${color} ${current * 3.6}deg, #ddd 0deg)`;
          }
        }, 20);
      }

      function analyze() {
        let file = document.getElementById("file").files[0];
        let skills = document.getElementById("skills").value;

        if (!file) {
          alert("Upload resume");
          return;
        }

        loading.style.display = "block";

        let formData = new FormData();
        formData.append("file", file);
        formData.append("skills", skills);

        fetch(BASE_URL + "/api/resume/upload", {
          method: "POST",
          body: formData,
        })
          .then((res) => res.json())
          .then((data) => {
            loading.style.display = "none";

            let extractedEmail = data.email || "Not Found";
            email.innerText = extractedEmail;

            animateCircle(data.matchScore || 0);

            downloadBtn.href = BASE_URL + "/api/resume/download/" + data.id;
            downloadBtn.target = "_blank";

            matched.innerHTML = (data.matchedSkills || [])
              .map((s) => `<p class="matched">✔ ${s}</p>`)
              .join("");
            missing.innerHTML = (data.missingSkills || [])
              .map((s) => `<p class="missing">✘ ${s}</p>`)
              .join("");

            let saveData = {
              id: data.id,
              email: extractedEmail,
              matchScore: data.matchScore || 0,
              matchedSkills: data.matchedSkills || [],
              missingSkills: data.missingSkills || [],
              analysisDate: new Date().toLocaleString(),
              time: new Date().getTime(),
            };

            let arr = JSON.parse(localStorage.getItem("analysis") || "[]");
            arr.push(saveData);
            localStorage.setItem("analysis", JSON.stringify(arr));
          })
          .catch(() => {
            loading.style.display = "none";
            alert("Error analyzing resume");
          });
      }

      function loadTable() {
        let arr = JSON.parse(localStorage.getItem("analysis") || "[]");
        renderTable(arr);
      }

      function renderTable(arr) {
        let tbody = document.querySelector("#table tbody");
        tbody.innerHTML = "";

        arr.forEach((d, i) => {
          tbody.innerHTML += `
    <tr>
      <td>${d.id || i + 1}</td>
      <td>${d.email}</td>
      <td>${d.matchScore}</td>
      <td>${d.matchedSkills.join(", ")}</td>
      <td>${d.missingSkills.join(", ")}</td>
      <td>${d.analysisDate}</td>
      <td class="delete" onclick="deleteRow(${i})">X</td>
    </tr>`;
        });
      }

      function deleteRow(i) {
        let arr = JSON.parse(localStorage.getItem("analysis"));
        arr.splice(i, 1);
        localStorage.setItem("analysis", JSON.stringify(arr));
        loadTable();
      }

      function filterTable() {
        let input = document.getElementById("search").value.toLowerCase();
        let rows = document.querySelectorAll("#table tbody tr");

        rows.forEach((r) => {
          let email = r.children[1].innerText.toLowerCase();
          r.style.display = email.includes(input) ? "" : "none";
        });
      }

      function applyFilter() {
        let arr = JSON.parse(localStorage.getItem("analysis") || "[]");
        let type = document.getElementById("filter").value;

        if (type === "scoreAsc")
          arr.sort((a, b) => a.matchScore - b.matchScore);
        else if (type === "scoreDesc")
          arr.sort((a, b) => b.matchScore - a.matchScore);
        else if (type === "new") arr.sort((a, b) => b.time - a.time);
        else if (type === "old") arr.sort((a, b) => a.time - b.time);

        renderTable(arr);
      }
    </script>
  </body>
</html>
