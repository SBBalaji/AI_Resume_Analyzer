<!doctype html>
<html>
  <head>
    <title>AI Resume Analyzer Dashboard</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI";
      }

      body {
        margin: 0;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        overflow: hidden;
        animation: pageEnter 1s ease;
      }

      /* ================= ENTRY ================= */
      .entry-overlay {
        position: fixed;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        animation: fadeOut 1.5s forwards;
      }
      @keyframes fadeOut {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          visibility: hidden;
        }
      }

      /* ================= PARTICLES ================= */
      canvas {
        position: fixed;
        top: 0;
        left: 0;
        z-index: -1;
      }

      /* ================= NAVBAR ================= */
      .navbar {
        display: flex;
        justify-content: space-between;
        padding: 15px 30px;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 1000;
      }

      .nav-right a {
        position: relative;
        margin-left: 20px;
        cursor: pointer;
        font-weight: bold;
        padding-bottom: 5px;
        transition: 0.3s;
      }

      .nav-right a::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0%;
        height: 2px;
        background: yellow;
        transition: 0.3s;
      }

      .nav-right a:hover::after {
        width: 100%;
      }
      .nav-right a.active {
        color: yellow;
      }

      /* ================= LAYOUT ================= */
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: calc(100vh - 60px);
        gap: 40px;
        padding: 20px;
        animation: slideFade 1s ease;
      }

      .left,
      .right {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
      }

      /* ================= CARD ================= */
      .box {
        width: 85%;
        padding: 30px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.15);
        transition: 0.4s;
        backdrop-filter: blur(10px);
        min-height: 350px;
      }

      .box:hover {
        transform: translateY(-10px) scale(1.03);
        box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
      }

      /* ================= INPUT ================= */
      input,
      select {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 6px;
        border: none;
      }

      /* ================= BUTTON ================= */
      button {
        margin-top: 10px;
        padding: 10px;
        background: red;
        border: none;
        color: white;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: darkred;
        transform: scale(1.05);
      }

      /* ================= LOADING ================= */
      #loading {
        display: none;
        margin-top: 10px;
        font-weight: bold;
        color: yellow;
      }

      /* ================= CIRCLE ================= */
      .circle {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: auto;
        font-size: 30px;
        font-weight: bold;
        background: conic-gradient(#ddd 0deg, #ddd 360deg);
        box-shadow: 0 0 25px #00ffcc;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 10px #00ffcc;
        }
        50% {
          box-shadow: 0 0 30px #00ffcc;
        }
        100% {
          box-shadow: 0 0 10px #00ffcc;
        }
      }

      /* ================= ANALYSIS ================= */
      #analysis {
        display: none;
        overflow: auto;
        height: calc(100vh - 60px);
      }

      /* ================= FIXED TOP BAR ================= */
      .top-controls {
        position: sticky;
        top: 70px;
        display: flex;
        justify-content: center;
        gap: 20px;
        padding: 15px;
        background: rgba(0, 0, 0, 0.4);
        z-index: 100;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }

      .top-controls input {
        width: 250px;
      }

      /* ================= SECOND FILTER ================= */
      .center-controls {
        text-align: center;
        margin-top: 20px;
      }

      /* ================= TABLE ================= */
      table {
        width: 90%;
        margin: 40px auto;
        background: white;
        color: black;
        border-radius: 10px;
        overflow: hidden;
      }

      th,
      td {
        padding: 12px;
        text-align: center;
      }

      th {
        background: #667eea;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="entry-overlay">
      <h1>🚀 Loading Dashboard...</h1>
    </div>

    <canvas id="bg"></canvas>

    <div class="navbar">
      <h2>🚀 AI Resume Analyzer</h2>
      <div class="nav-right">
        <a onclick="showDashboard()">Dashboard</a>
        <a onclick="showAnalysis()">Analysis</a>
        <a onclick="logout()">Logout</a>
      </div>
    </div>

    <!-- ================= DASHBOARD ================= -->
    <div id="dashboard" class="container">
      <div class="left">
        <div class="box">
          <h3>Upload Resume</h3>

          <input type="file" id="file" />
          <input id="skills" placeholder="java,python,react" />

          <button onclick="analyze()">Analyze</button>
          <p id="loading">⏳ Analyzing... 0s</p>
        </div>
      </div>

      <div class="right">
        <div class="box">
          <div class="circle" id="circle">0%</div>

          <h3>Email: <span id="email">-</span></h3>

          <h4>Matched Skills</h4>
          <div id="matched"></div>

          <h4>Missing Skills</h4>
          <div id="missing"></div>
        </div>
      </div>
    </div>

    <!-- ================= ANALYSIS ================= -->
    <div id="analysis">
      <div class="top-controls">
        <input id="searchInput" placeholder="Search email..." />
        <select id="filterSelect">
          <option value="">Sort</option>
          <option value="scoreHigh">High → Low</option>
          <option value="scoreLow">Low → High</option>
          <option value="new">Newest</option>
          <option value="old">Oldest</option>
        </select>
      </div>

      <div class="center-controls">
        <input
          id="search"
          placeholder="Search email..."
          onkeyup="filterTable()"
        />
        <select id="sort" onchange="sortTable()">
          <option value="">Sort</option>
          <option value="asc">Low → High</option>
          <option value="desc">High → Low</option>
        </select>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Score</th>
            <th>Matched</th>
            <th>Missing</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <script>
      const BASE_URL = "http://localhost:8080";
      let data = [];
      let allData = [];

      function showDashboard() {
        dashboard.style.display = "flex";
        analysis.style.display = "none";
      }

      function showAnalysis() {
        dashboard.style.display = "none";
        analysis.style.display = "block";
        loadTable();
      }

      function logout() {
        localStorage.clear();
        location.href = "login.html";
      }

      /* ✅ FIXED API */
      function loadTable() {
        fetch(BASE_URL + "/api/analysis")
          .then((res) => res.json())
          .then((res) => {
            data = res;
            allData = res;
            displayData(res);
          })
          .catch((err) => console.error(err));
      }

      function displayData(list) {
        tbody.innerHTML = list
          .map(
            (d) => `
<tr>
<td>${d.id}</td>
<td>${d.email || d.candidateEmail || "N/A"}</td>
<td>${d.matchScore}</td>
<td>${d.matchedSkills}</td>
<td>${d.missingSkills}</td>
<td><button onclick="deleteData(${d.id})">Delete</button></td>
</tr>`,
          )
          .join("");
      }

      searchInput.oninput = () => {
        let v = searchInput.value.toLowerCase();
        displayData(
          allData.filter((d) =>
            (d.email || d.candidateEmail || "").toLowerCase().includes(v),
          ),
        );
      };

      function filterTable() {
        let val = search.value.toLowerCase();
        displayData(
          data.filter((d) =>
            (d.email || d.candidateEmail || "").toLowerCase().includes(val),
          ),
        );
      }

      function sortTable() {
        let arr = [...data];
        if (sort.value === "asc")
          arr.sort((a, b) => a.matchScore - b.matchScore);
        if (sort.value === "desc")
          arr.sort((a, b) => b.matchScore - a.matchScore);
        displayData(arr);
      }

      function deleteData(id) {
        fetch(BASE_URL + "/api/admin/delete/" + id, { method: "DELETE" }).then(
          () => loadTable(),
        );
      }

      /* ✅ FIXED ANALYZE */
      function analyze() {
        let file = document.getElementById("file").files[0];
        let skills = document.getElementById("skills").value;

        if (!file) {
          alert("Upload resume");
          return;
        }

        let loading = document.getElementById("loading");
        loading.style.display = "block";

        let formData = new FormData();
        formData.append("file", file);
        formData.append("skills", skills);

        fetch(BASE_URL + "/api/resume/upload", {
          method: "POST",
          body: formData,
        })
          .then((res) => res.json())
          .then((res) => {
            document.getElementById("email").innerText =
              res.email || res.candidateEmail || "No email found";

            animateCircle(res.matchScore || 0);

            matched.innerHTML = (res.matchedSkills || []).join("<br>");
            missing.innerHTML = (res.missingSkills || []).join("<br>");

            loading.style.display = "none";

            loadTable();
          })
          .catch((err) => {
            loading.style.display = "none";
            alert("Error analyzing resume");
            console.error(err);
          });
      }

      function animateCircle(score) {
        let circle = document.getElementById("circle");
        let current = 0;

        let interval = setInterval(() => {
          if (current >= score) clearInterval(interval);
          else {
            current++;
            circle.innerText = current + "%";
            circle.style.background = `conic-gradient(#00e676 ${current * 3.6}deg,#ddd 0deg)`;
          }
        }, 15);
      }

      /* PARTICLES */
      let canvas = document.getElementById("bg");
      let ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let particles = Array.from({ length: 60 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
      }));

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p) => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
          ctx.fill();
          p.y += 0.5;
          if (p.y > canvas.height) p.y = 0;
        });
        requestAnimationFrame(draw);
      }
      draw();
    </script>
  </body>
</html>
