<!doctype html>
<html>
  <head>
    <title>AI Resume Analyzer Dashboard</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI";
      }

      body {
        margin: 0;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        overflow: hidden;
        animation: pageEnter 1s ease;
      }

      /* 🔥 PARTICLE BACKGROUND */
      canvas {
        position: fixed;
        top: 0;
        left: 0;
        z-index: -1;
      }

      /* 🔥 LOGIN ENTRY OVERLAY */
      .entry-overlay {
        position: fixed;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        animation: fadeOut 1.5s forwards;
      }

      @keyframes fadeOut {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          visibility: hidden;
        }
      }

      /* NAVBAR */
      .navbar {
        display: flex;
        justify-content: space-between;
        padding: 15px 30px;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 1000;
      }

      .nav-right a {
        position: relative;
        margin-left: 20px;
        cursor: pointer;
        font-weight: bold;
        padding-bottom: 5px;
      }

      .nav-right a::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0%;
        height: 2px;
        background: yellow;
        transition: 0.3s;
      }

      .nav-right a:hover::after {
        width: 100%;
      }

      .nav-right a.active {
        color: yellow;
      }

      /* LAYOUT */
      .container {
        display: flex;
        height: calc(100vh - 60px);
        padding: 30px;
        gap: 20px;
        overflow: hidden;
        animation: slideFade 1s ease;
      }

      .left,
      .right {
        flex: 1;
        display: flex;
        justify-content: center;
      }

      .left {
        align-items: center;
      }
      .right {
        align-items: flex-start;
      }

      .right .box {
        height: 100%;
        overflow-y: auto;
      }

      .box {
        width: 90%;
        padding: 25px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.15);
        transition: 0.4s;
      }

      .box:hover {
        transform: translateY(-8px) scale(1.02);
      }

      input {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 5px;
        border: none;
      }

      button {
        margin-top: 10px;
        padding: 10px;
        background: red;
        border: none;
        color: white;
        border-radius: 5px;
        cursor: pointer;
      }

      /* 🔥 GLOWING CIRCLE */
      .circle {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: auto;
        font-size: 30px;
        font-weight: bold;
        background: conic-gradient(#ddd 0deg, #ddd 360deg);
        box-shadow:
          0 0 20px #00ffcc,
          0 0 40px #00ffcc;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 10px #00ffcc;
        }
        50% {
          box-shadow: 0 0 30px #00ffcc;
        }
        100% {
          box-shadow: 0 0 10px #00ffcc;
        }
      }

      table {
        width: 90%;
        margin: 20px auto;
        background: white;
        color: black;
        border-radius: 10px;
      }

      th,
      td {
        padding: 10px;
        text-align: center;
      }

      th {
        background: #667eea;
        color: white;
      }

      #analysis {
        display: none;
      }

      /* ANIMATIONS */
      @keyframes pageEnter {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slideFade {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <!-- 🔥 ENTRY SCREEN -->
    <div class="entry-overlay">
      <h1>🚀 Loading Dashboard...</h1>
    </div>

    <!-- 🔥 PARTICLE CANVAS -->
    <canvas id="bg"></canvas>

    <div class="navbar">
      <h2>🚀 AI Resume Analyzer</h2>
      <div class="nav-right">
        <a onclick="showDashboard()">Dashboard</a>
        <a onclick="showAnalysis()">Analysis</a>
        <a onclick="logout()">Logout</a>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="container">
      <div class="left">
        <div class="box">
          <h3>Upload Resume</h3>
          <input type="file" id="file" />
          <input id="skills" placeholder="java,python,react" />
          <button onclick="analyze()">Analyze</button>
          <p id="loading" style="display: none">⏳ Analyzing...</p>
        </div>
      </div>

      <div class="right">
        <div class="box">
          <div class="circle" id="circle">0%</div>

          <h3>Email: <span id="email"></span></h3>

          <h4>Matched Skills</h4>
          <div id="matched"></div>

          <h4>Missing Skills</h4>
          <div id="missing"></div>
        </div>
      </div>
    </div>

    <!-- ANALYSIS -->
    <div id="analysis">
      <center>
        <input
          id="search"
          placeholder="Search email..."
          onkeyup="filterTable()"
        />
        <select onchange="sortTable()" id="sort">
          <option value="">Sort</option>
          <option value="asc">Low → High</option>
          <option value="desc">High → Low</option>
        </select>
      </center>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Score</th>
            <th>Matched</th>
            <th>Missing</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <script>
      const BASE_URL = "http://localhost:8080";
      let data = [];

      /* NAV ACTIVE */
      document.querySelectorAll(".nav-right a").forEach((link) => {
        link.addEventListener("click", function () {
          document
            .querySelectorAll(".nav-right a")
            .forEach((l) => l.classList.remove("active"));
          this.classList.add("active");
        });
      });

      /* LOGOUT */
      function logout() {
        localStorage.clear();
        alert("Logged out");
        location.href = "login.html";
      }

      /* NAV */
      function showDashboard() {
        dashboard.style.display = "flex";
        analysis.style.display = "none";
      }
      function showAnalysis() {
        dashboard.style.display = "none";
        analysis.style.display = "block";
        loadTable();
      }

      /* 🔥 INTRO CIRCLE */
      function introCircleAnimation() {
        let circle = document.getElementById("circle");
        let current = 0;

        let forward = setInterval(() => {
          if (current >= 100) {
            clearInterval(forward);
            let reverse = setInterval(() => {
              if (current <= 0) clearInterval(reverse);
              else {
                current--;
                circle.innerText = current + "%";
                circle.style.background = `conic-gradient(#00e676 ${current * 3.6}deg,#ddd 0deg)`;
              }
            }, 5);
          } else {
            current++;
            circle.innerText = current + "%";
            circle.style.background = `conic-gradient(#00e676 ${current * 3.6}deg,#ddd 0deg)`;
          }
        }, 5);
      }

      /* ANALYZE */
      function analyze() {
        let file = document.getElementById("file").files[0];
        let skills = document.getElementById("skills").value;
        if (!file) {
          alert("Upload resume");
          return;
        }

        loading.style.display = "block";

        let formData = new FormData();
        formData.append("file", file);
        formData.append("skills", skills);

        fetch(BASE_URL + "/api/resume/upload", {
          method: "POST",
          body: formData,
        })
          .then((res) => res.json())
          .then((res) => {
            loading.style.display = "none";
            email.innerText = res.email;
            animateCircle(res.matchScore || 0);
            matched.innerHTML = res.matchedSkills
              .map((s) => "✔ " + s)
              .join("<br>");
            missing.innerHTML = res.missingSkills
              .map((s) => "✘ " + s)
              .join("<br>");
          });
      }

      /* NORMAL CIRCLE */
      function animateCircle(score) {
        let circle = document.getElementById("circle");
        let current = 0;

        let interval = setInterval(() => {
          if (current >= score) clearInterval(interval);
          else {
            current++;
            circle.innerText = current + "%";
            circle.style.background = `conic-gradient(#00e676 ${current * 3.6}deg,#ddd 0deg)`;
          }
        }, 15);
      }

      /* TABLE */
      function loadTable() {
        fetch(BASE_URL + "/api/admin/analysis")
          .then((res) => res.json())
          .then((res) => {
            data = res;
            displayData(data);
          });
      }

      function displayData(list) {
        let html = "";
        list.forEach((d) => {
          html += `<tr>
      <td>${d.id}</td>
      <td>${d.email}</td>
      <td>${d.matchScore}</td>
      <td>${d.matchedSkills}</td>
      <td>${d.missingSkills}</td>
      <td><button onclick="deleteData(${d.id})">Delete</button></td>
    </tr>`;
        });
        tbody.innerHTML = html;
      }

      function filterTable() {
        let val = search.value.toLowerCase();
        displayData(data.filter((d) => d.email.toLowerCase().includes(val)));
      }

      function sortTable() {
        let type = sort.value;
        let arr = [...data];
        if (type === "asc") arr.sort((a, b) => a.matchScore - b.matchScore);
        if (type === "desc") arr.sort((a, b) => b.matchScore - a.matchScore);
        displayData(arr);
      }

      function deleteData(id) {
        fetch(BASE_URL + "/api/admin/delete/" + id, { method: "DELETE" }).then(
          () => loadTable(),
        );
      }

      /* 🔥 PARTICLES */
      let canvas = document.getElementById("bg");
      let ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let particles = [];
      for (let i = 0; i < 60; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        particles.forEach((p) => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
          ctx.fill();
          p.y += 0.5;
          if (p.y > canvas.height) p.y = 0;
        });
        requestAnimationFrame(draw);
      }
      draw();

      /* ON LOAD */
      window.onload = () => {
        introCircleAnimation();
      };
    </script>
  </body>
</html>
