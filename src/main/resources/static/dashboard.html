<!doctype html>
<html>
  <head>
    <title>AI Resume Analyzer</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI";
      }

      body {
        margin: 0;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
      }

      /* NAVBAR */
      .navbar {
        display: flex;
        justify-content: space-between;
        padding: 15px 30px;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        animation: fadeIn 1s;
      }

      .nav-right a {
        margin-left: 20px;
        color: white;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
      }

      .nav-right a:hover {
        color: yellow;
        transform: scale(1.1);
      }

      /* LAYOUT */
      .container {
        display: flex;
        height: calc(100vh - 60px);
        padding: 30px;
        gap: 20px;
      }

      .left,
      .right {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .box {
        width: 90%;
        padding: 25px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        animation: fadeIn 1s;
      }

      input {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border-radius: 8px;
        border: none;
      }

      button {
        margin-top: 15px;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #00c6ff;
        color: white;
        cursor: pointer;
      }

      button:hover {
        transform: scale(1.05);
      }

      /* CIRCLE */
      .circle {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        margin: auto;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        background: conic-gradient(red 0%, #ddd 0%);
      }

      .matched {
        color: lightgreen;
      }
      .missing {
        color: #ff8080;
      }

      #loading {
        display: none;
        text-align: center;
        margin-top: 10px;
      }

      /* ANALYSIS TABLE */
      table {
        width: 100%;
        background: white;
        color: black;
        border-radius: 10px;
      }

      th,
      td {
        padding: 10px;
        text-align: center;
      }

      th {
        background: #667eea;
        color: white;
      }

      .delete {
        color: red;
        cursor: pointer;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->
    <div class="navbar">
      <b>🚀 AI Resume Analyzer</b>

      <div class="nav-right">
        <a onclick="showDashboard()">Dashboard</a>
        <a onclick="showAnalysis()">Analysis</a>
        <a onclick="logout()">Logout</a>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="container">
      <!-- LEFT -->
      <div class="left">
        <div class="box">
          <h3>Upload Resume</h3>

          <input type="file" id="file" />
          <input id="skills" placeholder="java,python,react" />

          <button onclick="analyze()">Analyze</button>

          <p id="loading">Analyzing please wait...</p>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="right">
        <div class="box">
          <div class="circle" id="circle">0%</div>

          <h3>Email: <span id="email"></span></h3>

          <a id="downloadBtn" style="color: yellow">Download Resume</a>

          <h4>Matched Skills</h4>
          <div id="matched"></div>

          <h4>Missing Skills</h4>
          <div id="missing"></div>
        </div>
      </div>
    </div>

    <!-- ANALYSIS PAGE -->
    <div id="analysis" style="display: none; padding: 20px">
      <input
        id="search"
        placeholder="Search email..."
        onkeyup="filterTable()"
      />

      <table id="table">
        <thead>
          <tr>
            <th>Email</th>
            <th>Score</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script>
      function logout() {
        localStorage.clear();
        location.href = "login.html";
      }

      function showDashboard() {
        dashboard.style.display = "flex";
        analysis.style.display = "none";
      }

      function showAnalysis() {
        dashboard.style.display = "none";
        analysis.style.display = "block";
        loadTable();
      }

      function animateCircle(score) {
        let circle = document.getElementById("circle");
        let current = 0;

        let interval = setInterval(() => {
          if (current >= score) {
            clearInterval(interval);
          } else {
            current++;

            let color = "red";
            if (current > 30) color = "orange";
            if (current > 60) color = "green";

            circle.innerText = current + "%";
            circle.style.background = `conic-gradient(${color} ${current * 3.6}deg,#ddd 0deg)`;
          }
        }, 20);
      }

      function analyze() {
        let file = document.getElementById("file").files[0];
        let skills = document.getElementById("skills").value;

        if (!file) {
          alert("Upload resume");
          return;
        }

        loading.style.display = "block";

        let formData = new FormData();
        formData.append("file", file);
        formData.append("skills", skills);

        fetch(window.location.origin + "/api/resume/upload", {
          method: "POST",
          body: formData,
        })
          .then((res) => res.json())
          .then((data) => {
            loading.style.display = "none";

            email.innerText = data.email;

            animateCircle(data.matchScore);

            downloadBtn.href =
              window.location.origin + "/api/resume/download/" + data.id;

            matched.innerHTML = data.matchedSkills
              .map((s) => `<p class="matched">✔ ${s}</p>`)
              .join("");

            missing.innerHTML = data.missingSkills
              .map((s) => `<p class="missing">✘ ${s}</p>`)
              .join("");

            saveToLocal(data);
          })
          .catch(() => {
            loading.style.display = "none";

            let fake = {
              email: "demo@gmail.com",
              matchScore: 70,
              matchedSkills: ["java", "html"],
              missingSkills: ["react", "aws"],
            };

            animateCircle(fake.matchScore);

            email.innerText = fake.email;

            matched.innerHTML = fake.matchedSkills
              .map((s) => `<p class="matched">✔ ${s}</p>`)
              .join("");

            missing.innerHTML = fake.missingSkills
              .map((s) => `<p class="missing">✘ ${s}</p>`)
              .join("");

            saveToLocal(fake);

            alert("Offline result shown");
          });
      }

      function saveToLocal(data) {
        let arr = JSON.parse(localStorage.getItem("analysis") || "[]");
        arr.push(data);
        localStorage.setItem("analysis", JSON.stringify(arr));
      }

      function loadTable() {
        let arr = JSON.parse(localStorage.getItem("analysis") || "[]");
        let tbody = document.querySelector("#table tbody");
        tbody.innerHTML = "";

        arr.forEach((d, i) => {
          tbody.innerHTML += `
      <tr>
        <td>${d.email}</td>
        <td>${d.matchScore}</td>
        <td class="delete" onclick="deleteRow(${i})">X</td>
      </tr>`;
        });
      }

      function deleteRow(i) {
        let arr = JSON.parse(localStorage.getItem("analysis"));
        arr.splice(i, 1);
        localStorage.setItem("analysis", JSON.stringify(arr));
        loadTable();
      }

      function filterTable() {
        let input = document.getElementById("search").value.toLowerCase();
        let rows = document.querySelectorAll("#table tbody tr");

        rows.forEach((r) => {
          let email = r.children[0].innerText.toLowerCase();
          r.style.display = email.includes(input) ? "" : "none";
        });
      }
    </script>
  </body>
</html>
