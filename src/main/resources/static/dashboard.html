<!doctype html>
<html>
  <head>
    <title>AI Resume Analyzer Dashboard</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI";
      }

      body {
        margin: 0;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        overflow: hidden;
        animation: pageEnter 1s ease;
      }

      /* 🔥 PARTICLES */
      canvas {
        position: fixed;
        top: 0;
        left: 0;
        z-index: -1;
      }

      /* 🔥 ENTRY LOADER */
      .entry-overlay {
        position: fixed;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        animation: fadeOut 1.5s forwards;
      }

      @keyframes fadeOut {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          visibility: hidden;
        }
      }

      /* NAVBAR */
      .navbar {
        display: flex;
        justify-content: space-between;
        padding: 15px 30px;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
      }

      .nav-right a {
        margin-left: 20px;
        cursor: pointer;
        font-weight: bold;
      }

      /* LAYOUT */
      .container {
        display: flex;
        height: calc(100vh - 60px);
        padding: 30px;
        gap: 20px;
      }

      /* CARD */
      .box {
        width: 90%;
        padding: 25px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.15);
        transition: 0.4s;
      }

      .box:hover {
        transform: scale(1.03);
      }

      /* INPUT */
      input {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 6px;
        border: none;
      }

      /* BUTTON */
      button {
        margin-top: 10px;
        padding: 10px;
        background: red;
        border: none;
        color: white;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: darkred;
        transform: scale(1.05);
      }

      /* 🔥 CIRCLE (UNCHANGED CORE) */
      .circle {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: auto;
        font-size: 30px;
        font-weight: bold;
        background: conic-gradient(#ddd 0deg, #ddd 360deg);
        box-shadow: 0 0 25px #00ffcc;
      }

      /* TABLE */
      table {
        width: 90%;
        margin: 70px auto 20px;
        background: white;
        color: black;
        border-radius: 10px;
        overflow: hidden;
      }

      th {
        background: #667eea;
        color: white;
      }

      /* 🔥 FIXED TOP LEFT SEARCH */
      .top-controls {
        position: absolute;
        top: 80px;
        left: 30px;
        display: flex;
        gap: 10px;
        z-index: 100;
      }

      /* SEARCH SMALL */
      #searchInput {
        width: 200px;
        padding: 8px;
        border-radius: 8px;
      }

      /* FILTER */
      #filterSelect {
        padding: 8px;
        border-radius: 8px;
      }

      /* ANALYSIS */
      #analysis {
        display: none;
        position: relative;
      }

      /* ANIMATIONS */
      @keyframes pageEnter {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div class="entry-overlay">
      <h1>🚀 Loading Dashboard...</h1>
    </div>

    <canvas id="bg"></canvas>

    <div class="navbar">
      <h2>🚀 AI Resume Analyzer</h2>
      <div class="nav-right">
        <a onclick="showDashboard()">Dashboard</a>
        <a onclick="showAnalysis()">Analysis</a>
        <a onclick="logout()">Logout</a>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="container">
      <div class="box">
        <h3>Upload Resume</h3>
        <input type="file" id="file" />
        <input id="skills" placeholder="java,python,react" />
        <button onclick="analyze()">Analyze</button>
      </div>

      <div class="box">
        <div class="circle" id="circle">0%</div>
        <h3>Email: <span id="email"></span></h3>
        <div id="matched"></div>
        <div id="missing"></div>
      </div>
    </div>

    <!-- ANALYSIS -->
    <div id="analysis">
      <!-- 🔥 NEW SMALL SEARCH -->
      <div class="top-controls">
        <input id="searchInput" placeholder="Search email..." />
        <select id="filterSelect">
          <option value="">Sort</option>
          <option value="scoreHigh">High → Low</option>
          <option value="scoreLow">Low → High</option>
          <option value="new">Newest</option>
          <option value="old">Oldest</option>
        </select>
      </div>

      <!-- OLD (KEPT AS YOU ASKED) -->
      <center>
        <input
          id="search"
          placeholder="Search email..."
          onkeyup="filterTable()"
        />
        <select id="sort" onchange="sortTable()">
          <option value="">Sort</option>
          <option value="asc">Low → High</option>
          <option value="desc">High → Low</option>
        </select>
      </center>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Score</th>
            <th>Matched</th>
            <th>Missing</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <script>
      const BASE_URL = "http://localhost:8080";
      let data = [];
      let allData = [];

      /* NAV */
      function showDashboard() {
        dashboard.style.display = "flex";
        analysis.style.display = "none";
      }

      function showAnalysis() {
        dashboard.style.display = "none";
        analysis.style.display = "block";
        loadTable();
      }

      function logout() {
        localStorage.clear();
        location.href = "login.html";
      }

      /* 🔥 USER BASED FIX */
      function loadTable() {
        const email = localStorage.getItem("userEmail");

        fetch(BASE_URL + "/api/analysis/user/" + email)
          .then((res) => res.json())
          .then((res) => {
            data = res;
            allData = res;
            displayData(res);
          });
      }

      /* TABLE */
      function displayData(list) {
        let html = "";
        list.forEach((d) => {
          html += `<tr>
      <td>${d.id}</td>
      <td>${d.email}</td>
      <td>${d.matchScore}</td>
      <td>${d.matchedSkills}</td>
      <td>${d.missingSkills}</td>
      <td><button onclick="deleteData(${d.id})">Delete</button></td>
    </tr>`;
        });
        tbody.innerHTML = html;
      }

      /* OLD SEARCH */
      function filterTable() {
        let val = search.value.toLowerCase();
        displayData(data.filter((d) => d.email.toLowerCase().includes(val)));
      }

      /* OLD SORT */
      function sortTable() {
        let arr = [...data];
        if (sort.value === "asc")
          arr.sort((a, b) => a.matchScore - b.matchScore);
        if (sort.value === "desc")
          arr.sort((a, b) => b.matchScore - a.matchScore);
        displayData(arr);
      }

      /* NEW SEARCH */
      searchInput.addEventListener("input", () => {
        let val = searchInput.value.toLowerCase();
        displayData(allData.filter((d) => d.email.toLowerCase().includes(val)));
      });

      /* NEW FILTER */
      filterSelect.addEventListener("change", () => {
        let arr = [...allData];
        if (filterSelect.value === "scoreHigh")
          arr.sort((a, b) => b.matchScore - a.matchScore);
        if (filterSelect.value === "scoreLow")
          arr.sort((a, b) => a.matchScore - b.matchScore);
        if (filterSelect.value === "new") arr.sort((a, b) => b.id - a.id);
        if (filterSelect.value === "old") arr.sort((a, b) => a.id - b.id);
        displayData(arr);
      });

      /* DELETE */
      function deleteData(id) {
        fetch(BASE_URL + "/api/admin/delete/" + id, { method: "DELETE" }).then(
          () => loadTable(),
        );
      }

      /* ANALYZE (EMAIL FIX ADDED) */
      function analyze() {
        let file = document.getElementById("file").files[0];
        let skills = document.getElementById("skills").value;

        let formData = new FormData();
        formData.append("file", file);
        formData.append("skills", skills);

        formData.append("email", localStorage.getItem("userEmail"));

        fetch(BASE_URL + "/api/resume/upload", {
          method: "POST",
          body: formData,
        })
          .then((res) => res.json())
          .then((res) => {
            email.innerText = res.email;
            animateCircle(res.matchScore || 0);
            matched.innerHTML = res.matchedSkills.join("<br>");
            missing.innerHTML = res.missingSkills.join("<br>");
          });
      }

      /* 🔥 CIRCLE (UNCHANGED) */
      function animateCircle(score) {
        let circle = document.getElementById("circle");
        let current = 0;

        let interval = setInterval(() => {
          if (current >= score) clearInterval(interval);
          else {
            current++;
            circle.innerText = current + "%";
            circle.style.background = `conic-gradient(#00e676 ${current * 3.6}deg,#ddd 0deg)`;
          }
        }, 15);
      }

      /* PARTICLES */
      let canvas = document.getElementById("bg");
      let ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let particles = Array.from({ length: 60 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
      }));

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p) => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
          ctx.fill();
          p.y += 0.5;
          if (p.y > canvas.height) p.y = 0;
        });
        requestAnimationFrame(draw);
      }
      draw();
    </script>
  </body>
</html>
