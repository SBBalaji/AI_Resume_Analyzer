<!doctype html>
<html>
  <head>
    <title>AI Resume Analyzer Dashboard</title>

    <style>
      body {
        font-family: Arial;
        margin: 0;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
      }

      /* NAVBAR */
      .navbar {
        display: flex;
        justify-content: space-between;
        padding: 15px 30px;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
      }

      .nav-right a {
        margin-left: 20px;
        cursor: pointer;
        font-weight: bold;
      }

      .nav-right a:hover {
        color: yellow;
      }

      /* SECTIONS */
      .container {
        display: flex;
        padding: 30px;
        gap: 20px;
      }

      .box {
        flex: 1;
        padding: 20px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
      }

      input,
      select {
        padding: 10px;
        margin: 10px;
        border-radius: 5px;
        border: none;
      }

      button {
        padding: 6px 10px;
        background: red;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
      }

      /* TABLE */
      table {
        width: 90%;
        margin: 20px auto;
        border-collapse: collapse;
        background: white;
        color: black;
        border-radius: 10px;
        overflow: hidden;
      }

      th,
      td {
        padding: 12px;
        border-bottom: 1px solid #ddd;
        text-align: center;
      }

      th {
        background: #667eea;
        color: white;
      }

      tr:hover {
        background: #f1f1f1;
      }

      #analysis {
        display: none;
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->
    <div class="navbar">
      <h2>🚀 AI Resume Analyzer</h2>
      <div class="nav-right">
        <a onclick="showDashboard()">Dashboard</a>
        <a onclick="showAnalysis()">Analysis</a>
        <a onclick="logout()">Logout</a>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="container">
      <div class="box">
        <h3>Upload Resume</h3>
        <input type="file" id="file" />
        <input id="skills" placeholder="java,python,react" />
        <button onclick="analyze()">Analyze</button>
        <p id="loading" style="display: none">⏳ Analyzing...</p>
      </div>

      <div class="box">
        <h3>Result</h3>
        <h4>Email: <span id="email"></span></h4>
        <h4>Score: <span id="score"></span></h4>

        <h4>Matched Skills</h4>
        <div id="matched"></div>

        <h4>Missing Skills</h4>
        <div id="missing"></div>
      </div>
    </div>

    <!-- ANALYSIS PAGE -->
    <div id="analysis">
      <center>
        <input
          type="text"
          id="search"
          placeholder="Search by email..."
          onkeyup="filterTable()"
        />

        <select id="sort" onchange="sortTable()">
          <option value="">Sort By</option>
          <option value="asc">Score Low → High</option>
          <option value="desc">Score High → Low</option>
        </select>
      </center>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Score</th>
            <th>Matched Skills</th>
            <th>Missing Skills</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <script>
      const BASE_URL = "http://localhost:8080";
      let data = [];

      /* NAVIGATION */
      function showDashboard() {
        document.getElementById("dashboard").style.display = "flex";
        document.getElementById("analysis").style.display = "none";
      }

      function showAnalysis() {
        document.getElementById("dashboard").style.display = "none";
        document.getElementById("analysis").style.display = "block";
        loadTable();
      }

      function logout() {
        localStorage.clear();
        location.href = "login.html";
      }

      /* ANALYZE */
      function analyze() {
        let file = document.getElementById("file").files[0];
        let skills = document.getElementById("skills").value;

        if (!file) {
          alert("Upload resume");
          return;
        }

        document.getElementById("loading").style.display = "block";

        let formData = new FormData();
        formData.append("file", file);
        formData.append("skills", skills);

        fetch(BASE_URL + "/api/resume/upload", {
          method: "POST",
          body: formData,
        })
          .then((res) => res.json())
          .then((data) => {
            document.getElementById("loading").style.display = "none";

            document.getElementById("email").innerText = data.email;
            document.getElementById("score").innerText = data.matchScore;

            document.getElementById("matched").innerHTML = data.matchedSkills
              .map((s) => `✔ ${s}`)
              .join("<br>");

            document.getElementById("missing").innerHTML = data.missingSkills
              .map((s) => `✘ ${s}`)
              .join("<br>");
          });
      }

      /* LOAD TABLE */
      function loadTable() {
        fetch(BASE_URL + "/api/admin/analysis")
          .then((res) => res.json())
          .then((res) => {
            data = res;
            displayData(data);
          });
      }

      /* DISPLAY TABLE */
      function displayData(list) {
        let html = "";

        list.forEach((item) => {
          html += `
      <tr>
        <td>${item.id}</td>
        <td>${item.email}</td>
        <td>${item.matchScore}</td>
        <td>${item.matchedSkills}</td>
        <td>${item.missingSkills}</td>
        <td><button onclick="deleteData(${item.id})">Delete</button></td>
      </tr>
    `;
        });

        document.getElementById("tbody").innerHTML = html;
      }

      /* SEARCH */
      function filterTable() {
        let search = document.getElementById("search").value.toLowerCase();

        let filtered = data.filter((d) =>
          d.email.toLowerCase().includes(search),
        );

        displayData(filtered);
      }

      /* SORT */
      function sortTable() {
        let type = document.getElementById("sort").value;
        let sorted = [...data];

        if (type === "asc") {
          sorted.sort((a, b) => a.matchScore - b.matchScore);
        } else if (type === "desc") {
          sorted.sort((a, b) => b.matchScore - a.matchScore);
        }

        displayData(sorted);
      }

      /* DELETE */
      function deleteData(id) {
        fetch(BASE_URL + "/api/admin/delete/" + id, {
          method: "DELETE",
        })
          .then((res) => res.text())
          .then((msg) => {
            alert(msg);
            loadTable();
          });
      }
    </script>
  </body>
</html>
