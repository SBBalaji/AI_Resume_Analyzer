<!doctype html>
<html>
  <head>
    <title>AI Resume Analyzer Dashboard</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI";
      }

      body {
        margin: 0;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
      }

      /* NAVBAR */
      .navbar {
        display: flex;
        justify-content: space-between;
        padding: 15px 30px;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 1000;
      }

      .nav-right a {
        margin-left: 20px;
        cursor: pointer;
        font-weight: bold;
      }

      /* LAYOUT */
      .container {
        display: flex;
        height: calc(100vh - 60px);
        padding: 30px;
        gap: 20px;
        overflow: hidden;
      }

      .left,
      .right {
        flex: 1;
        display: flex;
        justify-content: center;
      }

      .left {
        align-items: center;
      }

      .right {
        align-items: flex-start;
      }

      .right .box {
        height: 100%;
        overflow-y: auto;
      }

      .box {
        width: 90%;
        padding: 25px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.15);
      }

      input {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 5px;
        border: none;
      }

      button {
        margin-top: 10px;
        padding: 10px;
        background: red;
        border: none;
        color: white;
        border-radius: 5px;
        cursor: pointer;
      }

      /* 🔥 FIXED CIRCLE */
      .circle {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: auto;
        font-size: 30px;
        font-weight: bold;
        background: conic-gradient(#ddd 0deg, #ddd 360deg);
      }

      table {
        width: 90%;
        margin: 20px auto;
        background: white;
        color: black;
        border-radius: 10px;
      }

      th,
      td {
        padding: 10px;
        text-align: center;
      }

      th {
        background: #667eea;
        color: white;
      }

      #analysis {
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="navbar">
      <h2>🚀 AI Resume Analyzer</h2>
      <div class="nav-right">
        <a onclick="showDashboard()">Dashboard</a>
        <a onclick="showAnalysis()">Analysis</a>
        <a onclick="logout()">Logout</a>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="container">
      <div class="left">
        <div class="box">
          <h3>Upload Resume</h3>
          <input type="file" id="file" />
          <input id="skills" placeholder="java,python,react" />
          <button onclick="analyze()">Analyze</button>
          <p id="loading" style="display: none">⏳ Analyzing...</p>
        </div>
      </div>

      <div class="right">
        <div class="box">
          <div class="circle" id="circle">0%</div>

          <h3>Email: <span id="email"></span></h3>

          <h4>Matched Skills</h4>
          <div id="matched"></div>

          <h4>Missing Skills</h4>
          <div id="missing"></div>
        </div>
      </div>
    </div>

    <!-- ANALYSIS -->
    <div id="analysis">
      <center>
        <input
          id="search"
          placeholder="Search email..."
          onkeyup="filterTable()"
        />

        <select onchange="sortTable()" id="sort">
          <option value="">Sort</option>
          <option value="asc">Low → High</option>
          <option value="desc">High → Low</option>
        </select>
      </center>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Score</th>
            <th>Matched</th>
            <th>Missing</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <script>
      const BASE_URL = "http://localhost:8080";
      let data = [];

      /* NAV */
      function showDashboard() {
        dashboard.style.display = "flex";
        analysis.style.display = "none";
      }
      function showAnalysis() {
        dashboard.style.display = "none";
        analysis.style.display = "block";
        loadTable();
      }

      /* 🔥 FIXED CIRCLE */
      function animateCircle(score) {
        let circle = document.getElementById("circle");

        circle.innerText = "0%";
        circle.style.background = "conic-gradient(#ddd 0deg,#ddd 360deg)";

        let current = 0;

        let interval = setInterval(() => {
          if (current >= score) {
            clearInterval(interval);
          } else {
            current++;
            circle.innerText = current + "%";
            circle.style.background = `conic-gradient(#00e676 ${current * 3.6}deg,#ddd 0deg)`;
          }
        }, 15);
      }

      /* ANALYZE */
      function analyze() {
        let file = document.getElementById("file").files[0];
        let skills = document.getElementById("skills").value;

        if (!file) {
          alert("Upload resume");
          return;
        }

        loading.style.display = "block";

        let formData = new FormData();
        formData.append("file", file);
        formData.append("skills", skills);

        fetch(BASE_URL + "/api/resume/upload", {
          method: "POST",
          body: formData,
        })
          .then((res) => res.json())
          .then((res) => {
            loading.style.display = "none";

            email.innerText = res.email;

            animateCircle(res.matchScore || 0);

            matched.innerHTML = res.matchedSkills
              .map((s) => "✔ " + s)
              .join("<br>");
            missing.innerHTML = res.missingSkills
              .map((s) => "✘ " + s)
              .join("<br>");
          });
      }

      /* TABLE */
      function loadTable() {
        fetch(BASE_URL + "/api/admin/analysis")
          .then((res) => res.json())
          .then((res) => {
            data = res;
            displayData(data);
          });
      }

      function displayData(list) {
        let html = "";
        list.forEach((d) => {
          html += `
    <tr>
      <td>${d.id}</td>
      <td>${d.email}</td>
      <td>${d.matchScore}</td>
      <td>${d.matchedSkills}</td>
      <td>${d.missingSkills}</td>
      <td><button onclick="deleteData(${d.id})">Delete</button></td>
    </tr>`;
        });
        tbody.innerHTML = html;
      }

      function filterTable() {
        let val = search.value.toLowerCase();
        displayData(data.filter((d) => d.email.toLowerCase().includes(val)));
      }

      function sortTable() {
        let type = sort.value;
        let arr = [...data];
        if (type === "asc") arr.sort((a, b) => a.matchScore - b.matchScore);
        if (type === "desc") arr.sort((a, b) => b.matchScore - a.matchScore);
        displayData(arr);
      }

      function deleteData(id) {
        fetch(BASE_URL + "/api/admin/delete/" + id, { method: "DELETE" }).then(
          () => loadTable(),
        );
      }
    </script>
  </body>
</html>
