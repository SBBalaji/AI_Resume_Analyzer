<!doctype html>
<html>
  <head>
    <title>AI Resume Analyzer</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #eef2f7;
      }

      .navbar {
        background: #2c3e50;
        color: white;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .nav-links {
        display: flex;
        align-items: center;
      }

      .nav-links a {
        color: white;
        margin-left: 20px;
        text-decoration: none;
        font-weight: bold;
      }

      .settings {
        position: relative;
        display: inline-block;
        margin-left: 20px;
        cursor: pointer;
      }

      .dropdown {
        display: none;
        position: absolute;
        background: white;
        min-width: 120px;
        right: 0;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        border-radius: 5px;
      }

      .dropdown a {
        display: block;
        padding: 10px;
        color: black;
        text-decoration: none;
      }

      .dropdown a:hover {
        background: #f4f4f4;
      }

      .settings:hover .dropdown {
        display: block;
      }

      .dashboard {
        width: 90%;
        margin: auto;
        margin-top: 30px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
      }

      .card {
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
      }

      .upload-area {
        border: 2px dashed #667eea;
        padding: 30px;
        border-radius: 10px;
        text-align: center;
        cursor: pointer;
        margin-bottom: 15px;
      }

      #fileName {
        margin-top: 10px;
        font-weight: bold;
      }

      input {
        width: 95%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      button {
        padding: 10px 15px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
      }

      .remove-btn {
        background: #e74c3c;
      }

      .result-list {
        list-style: none;
        padding: 0;
      }

      .matched {
        color: green;
      }
      .missing {
        color: red;
      }

      #score {
        margin-top: 15px;
        font-size: 18px;
        line-height: 28px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="navbar">
      <div><b>AI Resume Analyzer</b></div>

      <div class="nav-links">
        <a href="index.html">Dashboard</a>
        <a href="admin.html">Admin</a>

        <div class="settings">
          <span id="userInfo"></span>

          <div class="dropdown">
            <a href="logout.html">Logout</a>
          </div>
        </div>
      </div>
    </div>

    <div class="dashboard">
      <div class="card">
        <h3>Upload Resume</h3>

        <form id="resumeForm">
          <div class="upload-area" id="dropArea">
            <p>Drag & Drop Resume Here</p>
            <p>Recommended: Upload PDF resume</p>

            <input type="file" id="file" hidden />

            <!-- FIXED BUTTON -->
            <button type="button" onclick="chooseFile(event)">
              Choose File
            </button>

            <button type="button" class="remove-btn" onclick="clearResume()">
              Remove Resume
            </button>

            <p id="fileName"></p>
          </div>

          <label>Enter Job Description Skills</label>

          <input
            type="text"
            id="jobDesc"
            placeholder="Example: java,spring,mysql,react"
            required
          />

          <button type="submit">Analyze Resume</button>
        </form>

        <div id="score"></div>
      </div>

      <div class="card">
        <h3>Skill Analysis</h3>

        <h4>Matched Skills</h4>
        <ul id="matched" class="result-list"></ul>

        <h4>Missing Skills</h4>
        <ul id="missing" class="result-list"></ul>
      </div>
    </div>

    <script>
      if (!localStorage.getItem("userEmail")) {
        window.location = "login.html";
      }

      const name = localStorage.getItem("userName");
      const email = localStorage.getItem("userEmail");

      document.getElementById("userInfo").innerText = name + " (" + email + ")";

      const fileInput = document.getElementById("file");
      const dropArea = document.getElementById("dropArea");
      const fileName = document.getElementById("fileName");

      // FIXED CLICK HANDLER
      dropArea.addEventListener("click", (e) => {
        if (e.target.tagName !== "BUTTON") {
          fileInput.click();
        }
      });

      // BUTTON CLICK FIX
      function chooseFile(event) {
        event.stopPropagation();

        fileInput.click();
      }

      fileInput.addEventListener("change", () => {
        if (fileInput.files.length > 0) {
          fileName.innerText = fileInput.files[0].name;
        }
      });

      function clearResume() {
        fileInput.value = "";
        fileName.innerText = "";

        document.getElementById("score").innerHTML = "";
        document.getElementById("matched").innerHTML = "";
        document.getElementById("missing").innerHTML = "";
      }

      document
        .getElementById("resumeForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          if (!fileInput.files.length) {
            alert("Please upload a resume first");
            return;
          }

          const formData = new FormData();

          formData.append("file", fileInput.files[0]);
          formData.append("jobDesc", document.getElementById("jobDesc").value);
          formData.append("adminEmail", localStorage.getItem("userEmail"));

          const response = await fetch(
            "http://localhost:8080/api/resume/upload",
            {
              method: "POST",
              body: formData,
            },
          );

          const result = await response.json();

          document.getElementById("score").innerHTML =
            "<b>Candidate Email :</b> " +
            result.candidateEmail +
            "<br><b>Candidate Name :</b> " +
            result.candidateName +
            "<br><b>Location :</b> " +
            result.location +
            "<br><b>Degree :</b> " +
            result.degree +
            "<br><b>Stream :</b> " +
            result.stream +
            "<br><b>Passout Year :</b> " +
            result.passoutYear +
            "<br><b>Phone :</b> " +
            result.phone +
            "<br><b>University :</b> " +
            result.university +
            "<br><b>Experience :</b> " +
            result.experience +
            "<br><b>Match Score :</b> " +
            result.matchScore +
            "%";

          const matched = document.getElementById("matched");
          matched.innerHTML = "";

          result.matchedSkills.forEach((skill) => {
            const li = document.createElement("li");

            li.classList.add("matched");

            li.innerText = "✔ " + skill;

            matched.appendChild(li);
          });

          const missing = document.getElementById("missing");
          missing.innerHTML = "";

          result.missingSkills.forEach((skill) => {
            const li = document.createElement("li");

            li.classList.add("missing");

            li.innerText = "✘ " + skill;

            missing.appendChild(li);
          });
        });
    </script>
  </body>
</html>
