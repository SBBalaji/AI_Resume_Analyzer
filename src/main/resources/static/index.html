<!doctype html>
<html>
  <head>
    <title>AI Resume Analyzer</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: linear-gradient(135deg, #667eea, #764ba2);
        height: 100vh;
        overflow: hidden;
      }

      /* NAVBAR */
      .navbar {
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        color: white;
      }

      .nav-right {
        display: flex;
        gap: 20px;
        align-items: center;
      }

      .nav-right a {
        color: white;
        text-decoration: none;
        font-weight: bold;
      }

      .nav-right a:hover {
        color: #ffd369;
      }

      /* USER MENU */
      .user-menu {
        position: relative;
        cursor: pointer;
      }

      .dropdown {
        display: none;
        position: absolute;
        right: 0;
        background: white;
        color: black;
        padding: 10px;
        border-radius: 6px;
      }

      .dropdown p {
        margin: 0;
        cursor: pointer;
      }
      .dropdown p:hover {
        color: red;
      }

      /* LAYOUT */
      .container {
        display: flex;
        height: calc(100vh - 70px);
        padding: 40px;
        gap: 30px;
      }

      /* LEFT */
      .left {
        width: 40%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .upload-box {
        width: 90%;
        padding: 35px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(15px);
        text-align: center;
        color: white;
      }

      /* INPUT */
      input {
        width: 90%;
        padding: 12px;
        margin-top: 12px;
        border-radius: 8px;
        border: none;
      }

      /* BUTTON */
      button {
        margin-top: 20px;
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(45deg, #00c6ff, #0072ff);
        color: white;
        cursor: pointer;
      }

      button:hover {
        transform: scale(1.05);
      }

      /* RIGHT */
      .right {
        width: 60%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .result-box {
        width: 80%;
        height: 80vh;
        overflow-y: auto;
        padding: 30px;
        border-radius: 15px;
        background: white;
        text-align: center;
      }

      /* SCROLL */
      .result-box::-webkit-scrollbar {
        width: 6px;
      }
      .result-box::-webkit-scrollbar-thumb {
        background: #667eea;
        border-radius: 10px;
      }

      /* SCORE CIRCLE */
      .circle {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        margin: 10px auto;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 22px;
        font-weight: bold;
      }

      /* SKILL */
      .skill {
        margin: 10px 0;
        text-align: left;
      }

      .bar {
        height: 8px;
        background: #ddd;
        border-radius: 10px;
      }

      .fill {
        height: 8px;
        background: #28a745;
        border-radius: 10px;
        width: 0%;
        transition: 1s;
      }

      .matched {
        color: green;
      }
      .missing {
        color: red;
      }

      #loading {
        display: none;
        color: black;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <!-- ✅ LOGIN CHECK -->
    <script>
      const name = localStorage.getItem("userName");
      const email = localStorage.getItem("userEmail");

      if (!name || !email) {
        window.location.href = "signup.html";
      }
    </script>

    <!-- NAVBAR -->
    <div class="navbar">
      <b>🚀 AI Resume Analyzer</b>

      <div class="nav-right">
        <a href="index.html">Dashboard</a>
        <a href="admin.html">Analysis</a>

        <div class="user-menu">
          <span id="userInfo" onclick="toggleMenu()"></span>
          <div id="dropdown" class="dropdown">
            <p onclick="logout()">Logout</p>
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <!-- LEFT -->
      <div class="left">
        <div class="upload-box">
          <h2>📄 Upload Resume</h2>

          <input type="file" id="file" />
          <input id="skills" placeholder="Enter skills (java,python...)" />

          <button onclick="analyze()">Analyze</button>

          <p id="loading">Analyzing... please wait</p>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="right">
        <div class="result-box">
          <h3>Email : <span id="email"></span></h3>

          <div class="circle" id="circle">0%</div>

          <h3>Match Score : <span id="score"></span>%</h3>

          <a id="downloadBtn">Download Resume</a>

          <h3>Matched Skills</h3>
          <div id="matched"></div>

          <h3>Missing Skills</h3>
          <div id="missing"></div>
        </div>
      </div>
    </div>

    <script>
      document.getElementById("userInfo").innerText = name + " (" + email + ")";

      function toggleMenu() {
        let d = document.getElementById("dropdown");
        d.style.display = d.style.display === "block" ? "none" : "block";
      }

      function logout() {
        localStorage.clear();
        window.location = "login.html";
      }

      function analyze() {
        let file = document.getElementById("file").files[0];
        let skills = document.getElementById("skills").value;

        if (!file) {
          alert("Upload resume");
          return;
        }

        document.getElementById("loading").style.display = "block";

        const BASE_URL = window.location.origin.includes("127.0.0.1")
          ? "http://localhost:8080"
          : window.location.origin;

        let formData = new FormData();
        formData.append("file", file);
        formData.append("skills", skills);

        fetch(BASE_URL + "/api/resume/upload", {
          method: "POST",
          body: formData,
        })
          .then((res) => res.json())
          .then((data) => {
            document.getElementById("loading").style.display = "none";

            document.getElementById("email").innerText = data.email || "";
            document.getElementById("score").innerText = data.matchScore || 0;

            document.getElementById("downloadBtn").href =
              BASE_URL + "/api/resume/download/" + data.id;

            let score = data.matchScore || 0;
            let circle = document.getElementById("circle");
            let current = 0;

            let interval = setInterval(() => {
              if (current >= score) {
                clearInterval(interval);
              } else {
                current++;

                circle.innerText = current + "%";

                let color = "#ff4d4d";
                if (current > 30) color = "#ffa500";
                if (current > 60) color = "#28a745";

                circle.style.background = `conic-gradient(${color} ${current * 3.6}deg,#ddd 0deg)`;
              }
            }, 20);

            let matchedHTML = "";
            (data.matchedSkills || []).forEach((s) => {
              matchedHTML += `
              <div class="skill">
                ✔ ${s}
                <div class="bar"><div class="fill"></div></div>
              </div>`;
            });

            document.getElementById("matched").innerHTML = matchedHTML;

            setTimeout(() => {
              document.querySelectorAll(".fill").forEach((b) => {
                b.style.width = "90%";
              });
            }, 200);

            let missingHTML = "";
            (data.missingSkills || []).forEach((s) => {
              missingHTML += `<p class="missing">✘ ${s}</p>`;
            });

            document.getElementById("missing").innerHTML = missingHTML;
          })
          .catch(() => {
            document.getElementById("loading").style.display = "none";

            alert("Offline mode showing demo result");

            let fake = {
              email: "demo@gmail.com",
              matchScore: 65,
              matchedSkills: ["java", "html"],
              missingSkills: ["react", "aws"],
            };

            document.getElementById("email").innerText = fake.email;
            document.getElementById("score").innerText = fake.matchScore;

            let circle = document.getElementById("circle");
            circle.innerText = fake.matchScore + "%";

            document.getElementById("matched").innerHTML = fake.matchedSkills
              .map((s) => `<p class="matched">✔ ${s}</p>`)
              .join("");

            document.getElementById("missing").innerHTML = fake.missingSkills
              .map((s) => `<p class="missing">✘ ${s}</p>`)
              .join("");
          });
      }
    </script>
  </body>
</html>
