<!doctype html>
<html>
  <head>
    <title>Login | AI Resume Analyzer</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: Arial;
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(-45deg, #667eea, #764ba2, #6a11cb, #2575fc);
        background-size: 400% 400%;
        animation: gradientMove 8s ease infinite;
      }

      @keyframes gradientMove {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .container {
        background: white;
        padding: 40px;
        width: 350px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      h2 {
        text-align: center;
        margin-bottom: 25px;
      }

      input {
        width: 100%;
        padding: 10px;
        margin: 5px 0 15px;
        border-radius: 5px;
        border: 1px solid #ccc;
      }

      .password-box {
        position: relative;
      }

      .toggle {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 12px;
        color: #667eea;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #667eea;
        border: none;
        color: white;
        border-radius: 6px;
        cursor: pointer;
      }

      button:disabled {
        background: gray;
      }

      #loginLoading {
        display: none;
        text-align: center;
        color: #667eea;
        margin-top: 10px;
      }

      .links {
        text-align: center;
        margin-top: 10px;
      }

      .links a {
        color: #667eea;
        text-decoration: none;
        font-weight: bold;
      }

      .links a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Login</h2>

      <form id="loginForm">
        <input id="email" type="email" placeholder="Email" required />

        <div class="password-box">
          <input
            id="password"
            type="password"
            placeholder="Password"
            required
          />
          <span class="toggle" onclick="togglePassword()">Show</span>
        </div>

        <button id="loginBtn" type="submit">Login</button>
      </form>

      <p id="loginLoading">Logging in...</p>

      <div class="links">
        <p><a href="signup.html">Create Account</a></p>
        <p><a href="forgot.html" style="color: red">Forgot Password?</a></p>
      </div>
    </div>

    <script>
      function togglePassword() {
        const field = document.getElementById("password");
        field.type = field.type === "password" ? "text" : "password";
      }

      document.getElementById("loginForm").addEventListener("submit", login);

      async function login(e) {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
          alert("Enter email and password");
          return;
        }

        const BASE_URL = window.location.origin.includes("127.0.0.1")
          ? "http://localhost:8080"
          : window.location.origin;

        const btn = document.getElementById("loginBtn");
        const loading = document.getElementById("loginLoading");

        btn.disabled = true;
        loading.style.display = "block";

        try {
          const res = await fetch(`${BASE_URL}/api/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const data = await res.json();

          if (data.success) {
            // 🔥 STORE USER DATA (VERY IMPORTANT)
            localStorage.setItem("userName", data.name);
            localStorage.setItem("userEmail", data.email);

            console.log("Logged in as:", data.email);

            window.location.href = "dashboard.html";
          } else {
            alert(data.message || "Invalid login");
          }
        } catch (err) {
          // 🔥 OFFLINE MODE
          const storedEmail = localStorage.getItem("userEmail");

          if (storedEmail && storedEmail === email) {
            alert("Offline Login Success");
            window.location.href = "dashboard.html";
          } else {
            alert("Offline: user not found. Please signup first.");
          }
        }

        btn.disabled = false;
        loading.style.display = "none";
      }
    </script>
  </body>
</html>
